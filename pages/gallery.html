<!DOCTYPE html>
<html>
<head>
    <title>Festival Philippines - Gallery</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #fffdf5;
        }

        header {
            background: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 38px;
            font-weight: bold;
            color: #123f78;
        }

        .logo span {
            color: #d72e2e;
        }

        nav a {
            text-decoration: none;
            color: black;
            margin: 15px;
            font-weight: bold;
            font-size: 17px;
        }

        nav a:hover {
            color: #23743c;
        }

        h1 {
            text-align: center;
            color: #23743c;
            font-size: 50px;
        }

        p {
            text-align: center;
            font-size: 20px;
        }

        .buttons {
            text-align: center;
            margin: 30px;
        }

        .buttons button {
            border: none;
            padding: 12px 25px;
            margin: 5px;
            border-radius: 25px;
            font-weight: bold;
        }

        .gallery {
            width: 95%;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 15px;
        }

        footer {
            margin-top: 50px;
            background: #07366b;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>
